<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Turned Off</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="scanlines"></div>
  <div class="vignette"></div>

  <main class="scene">
    <div class="face-wrap">
      <div class="halo"></div>

      <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="tear left"></div>
        <div class="tear right"></div>
        <div class="mouth"></div>
        <div class="blush left"></div>
        <div class="blush right"></div>
      </div>
    </div>

    <h1 class="title" data-text="This Website has been Turned off">
      This Website has been Turned off
    </h1>

    <p class="subtitle">
      By the Admin <span class="emoji">☹</span>
    </p>

    <p class="hint">
      <span id="hint"></span><span class="cursor">▌</span>
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
